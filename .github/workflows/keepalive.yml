name: ⚡ Keep Render Alive

on:
  schedule:
    - cron: '*/4 * * * *'  # a cada 4 minutos (Render hiberna em 15min)
  workflow_dispatch:        # permite rodar manualmente

jobs:
  ping:
    name: Ping Render
    runs-on: ubuntu-latest
    steps:
      - name: 🏓 Ping servidor
        run: |
          echo "Pingando https://bot-garra-uv2r.onrender.com/ ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 45 https://bot-garra-uv2r.onrender.com/)
          echo "Status HTTP: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Servidor acordado e respondendo"
          else
            echo "⚠️ Servidor retornou status $STATUS"
          fi
