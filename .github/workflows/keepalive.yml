name: ⚡ Keep Render Alive

on:
  schedule:
    - cron: '*/5 * * * *'  # a cada 5 minutos
  workflow_dispatch:        # permite rodar manualmente

jobs:
  ping:
    name: Ping Render
    runs-on: ubuntu-latest
    steps:
      - name: 🏓 Ping servidor
        run: |
          echo "Pingando https://bot-garra-uv2r.onrender.com/ping ..."
          curl -s --max-time 30 https://bot-garra-uv2r.onrender.com/ping
          echo ""
          echo "✅ Ping enviado"
