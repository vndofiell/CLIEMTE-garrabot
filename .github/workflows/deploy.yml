name: 🚀 Deploy Automático para Render

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Notifica push (Render faz deploy automatico via GitHub)
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Deploy iniciado pelo Render automaticamente
        run: |
          echo "✅ Push recebido na branch main."
          echo "O Render detecta este push e inicia o deploy automaticamente."
          echo "Acompanhe em: https://dashboard.render.com"
