<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GARRABOT — Conectar</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#000; overflow:hidden; font-family:'Share Tech Mono',monospace; }
        canvas { position:fixed; top:0; left:0; z-index:0; }
        .center {
            position:fixed; top:0; left:0; width:100%; height:100%;
            display:flex; align-items:center; justify-content:center; z-index:10;
        }
        .box {
            border:1px solid #00ff41;
            padding:48px 40px; width:380px; text-align:center;
            box-shadow:0 0 50px rgba(0,255,65,0.4), inset 0 0 40px rgba(0,255,65,0.04);
            background:rgba(0,5,0,0.88);
            position:relative;
        }
        .box::before {
            content:''; position:absolute; top:-1px; left:10%; width:80%; height:2px;
            background:linear-gradient(90deg,transparent,#00ff41,transparent);
        }
        .logo { font-size:1.6rem; letter-spacing:8px; color:#00ff41; margin-bottom:4px; text-shadow:0 0 20px #00ff41; }
        .sub  { font-size:0.6rem; letter-spacing:4px; color:#1a5c2a; margin-bottom:32px; }
        .divider { border:none; border-top:1px solid #0a2a0a; margin:20px 0; }
        .info { font-size:0.63rem; color:#1a6630; margin-bottom:28px; letter-spacing:1px; line-height:1.8; }
        .btn {
            width:100%; padding:14px;
            background:rgba(0,255,65,0.07); border:1px solid #00ff41;
            color:#00ff41; font-family:'Share Tech Mono',monospace;
            font-size:0.88rem; letter-spacing:4px; cursor:pointer; transition:all 0.2s;
        }
        .btn:hover { background:rgba(0,255,65,0.18); box-shadow:0 0 24px rgba(0,255,65,0.5); color:#fff; }
        .btn:disabled { opacity:0.35; cursor:not-allowed; }
        .status { margin-top:14px; font-size:0.63rem; color:#1a5c2a; min-height:1.2em; letter-spacing:1px; }
    </style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="center">
    <div class="box">
        <div class="logo">GARRABOT</div>
        <div class="sub">CYBER TRADING SYSTEM v2.0</div>
        <hr class="divider">
        <div class="info">
            &#9658; AUTENTICACAO SEGURA VIA DERIV OAUTH2<br>
            &#9658; SEUS DADOS NAO SAO ARMAZENADOS<br>
            &#9658; CONEXAO CRIPTOGRAFADA PKCE
        </div>
        <button class="btn" id="loginBtn">&#9889; CONECTAR CONTA DERIV</button>
        <div class="status" id="status">AGUARDANDO COMANDO...</div>
    </div>
</div>
<script>
    // ── Matrix rain ──────────────────────────────────────────────────
    const canvas = document.getElementById('matrix');
    const ctx    = canvas.getContext('2d');
    const chars  = 'GARRABOT01ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿ0123456789ABCDEF$#@%&'.split('');
    let cols, drops;
    function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
        cols  = Math.floor(canvas.width / 16);
        drops = Array(cols).fill(1);
    }
    resize();
    window.addEventListener('resize', resize);
    function draw() {
        ctx.fillStyle = 'rgba(0,0,0,0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ff41';
        ctx.font = '14px Share Tech Mono';
        for (let i = 0; i < drops.length; i++) {
            const ch = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillStyle = drops[i] * 16 < canvas.height * 0.1 ? '#fff' : '#00ff41';
            ctx.fillText(ch, i * 16, drops[i] * 16);
            if (drops[i] * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(draw, 50);

    // ── OAuth PKCE ───────────────────────────────────────────────────
    async function generateChallenge(verifier) {
        const data = new TextEncoder().encode(verifier);
        const hash = await crypto.subtle.digest('SHA-256', data);
        return btoa(String.fromCharCode(...new Uint8Array(hash)))
            .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    }
    document.getElementById('loginBtn').addEventListener('click', async () => {
        const btn    = document.getElementById('loginBtn');
        const status = document.getElementById('status');
        btn.disabled = true;
        status.textContent = 'INICIALIZANDO PROTOCOLO OAUTH...';
        const clientId    = '33qw17TW2WM9OqeTqtRaC';
        const redirectUri = 'https://garrabot.duckdns.org/callback.html';
        const verifier    = Array.from(crypto.getRandomValues(new Uint8Array(32))).map(b=>b.toString(16).padStart(2,'0')).join('');
        const state       = Math.random().toString(36).substring(2);
        sessionStorage.setItem('pkce_verifier', verifier);
        sessionStorage.setItem('oauth_state',   state);
        const challenge = await generateChallenge(verifier);

        // Envia o verifier para a VPS antes de redirecionar
        // (necessário pois a VPS não tem sessionStorage do browser)
        status.textContent = 'ENVIANDO CREDENCIAIS...';
        try {
            await fetch('https://garrabot.duckdns.org/store-verifier', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ verifier: verifier })
            });
        } catch(e) { /* silencioso — fallback funciona */ }

        status.textContent = 'REDIRECIONANDO PARA DERIV...';
        window.location.href = 'https://auth.deriv.com/oauth2/auth?' +
            'response_type=code' +
            '&client_id='         + clientId +
            '&redirect_uri='      + encodeURIComponent(redirectUri) +
            '&state='             + state +
            '&code_challenge='    + challenge +
            '&code_challenge_method=S256' +
            '&scope=trade+account_manage';
    });
</script>
</body>
</html>
