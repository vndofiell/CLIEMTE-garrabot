<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GARRABOT — Autenticando...</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#000; overflow:hidden; font-family:'Share Tech Mono',monospace; }
        canvas { position:fixed; top:0; left:0; z-index:0; }
        .center {
            position:fixed; top:0; left:0; width:100%; height:100%;
            display:flex; align-items:center; justify-content:center; z-index:10;
        }
        .box {
            border:1px solid #00ff41;
            padding:48px 40px; width:420px; text-align:center;
            box-shadow:0 0 50px rgba(0,255,65,0.4), inset 0 0 40px rgba(0,255,65,0.04);
            background:rgba(0,5,0,0.88); position:relative;
        }
        .box::before {
            content:''; position:absolute; top:-1px; left:10%; width:80%; height:2px;
            background:linear-gradient(90deg,transparent,#00ff41,transparent);
        }
        .logo   { font-size:1.6rem; letter-spacing:8px; color:#00ff41; margin-bottom:4px; text-shadow:0 0 20px #00ff41; }
        .sub    { font-size:0.6rem; letter-spacing:4px; color:#1a5c2a; margin-bottom:32px; }
        .msg    { font-size:1.1rem; letter-spacing:3px; margin-bottom:8px; }
        .detail { font-size:0.65rem; color:#1a6630; letter-spacing:1px; margin-top:10px; line-height:2; }
        .spin::after { content:''; animation:dots 1.2s steps(4,end) infinite; }
        @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} 100%{content:''} }
        .btn-fechar {
            margin-top:20px; width:100%; padding:10px;
            background:rgba(0,255,65,0.08); border:1px solid #00ff41;
            color:#00ff41; font-family:'Share Tech Mono',monospace;
            font-size:0.78rem; letter-spacing:2px; cursor:pointer;
        }
        .btn-fechar:hover { background:rgba(0,255,65,0.2); }
    </style>
</head>
<body>
<canvas id="matrix"></canvas>
<div class="center">
    <div class="box">
        <div class="logo">GARRABOT</div>
        <div class="sub">CYBER TRADING SYSTEM v2.0</div>
        <div id="msg" class="msg">&#9203; AUTENTICANDO<span class="spin"></span></div>
        <div id="detail" class="detail">TROCANDO CODIGO DE AUTORIZACAO...</div>
        <div id="btn-area"></div>
    </div>
</div>
<script>
    // ── Matrix rain ──────────────────────────────────────────────────
    const canvas = document.getElementById('matrix');
    const ctx    = canvas.getContext('2d');
    const chars  = 'GARRABOT01ｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿ0123456789ABCDEF$#@%&'.split('');
    let cols, drops;
    function resize() {
        canvas.width  = window.innerWidth;
        canvas.height = window.innerHeight;
        cols  = Math.floor(canvas.width / 16);
        drops = Array(cols).fill(1);
    }
    resize();
    window.addEventListener('resize', resize);
    function draw() {
        ctx.fillStyle = 'rgba(0,0,0,0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = '14px Share Tech Mono';
        for (let i = 0; i < drops.length; i++) {
            const ch = chars[Math.floor(Math.random() * chars.length)];
            ctx.fillStyle = drops[i] * 16 < canvas.height * 0.1 ? '#fff' : '#00ff41';
            ctx.fillText(ch, i * 16, drops[i] * 16);
            if (drops[i] * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(draw, 50);

    // ── OAuth callback ───────────────────────────────────────────────
    var urlParams = new URLSearchParams(window.location.search);
    var erroParam = urlParams.get('error');
    var code      = urlParams.get('code');
    var verifier  = sessionStorage.getItem('pkce_verifier');
    var msgEl     = document.getElementById('msg');
    var detailEl  = document.getElementById('detail');
    var btnArea   = document.getElementById('btn-area');

    function mostrarBotaoFechar() {
        btnArea.innerHTML = '<button class="btn-fechar" onclick="window.close()">✕ FECHAR ESTA ABA</button>';
    }

    // ── Erro direto da Deriv (link ja usado, acesso negado, etc.) ────
    if (erroParam) {
        msgEl.innerHTML   = '&#128260; LINK JA UTILIZADO';
        msgEl.style.color = '#ffbd2e';
        detailEl.innerHTML =
            'Este link de login ja foi usado.<br>' +
            'Cada conexao gera um codigo unico.<br><br>' +
            '<span style="color:#aaa">&#9658; FECHE esta aba<br>' +
            '&#9658; No bot, clique em <b style="color:#00ff41">conectar</b><br>' +
            '&#9658; Clique em <b style="color:#00ff41">CONECTAR CONTA DERIV</b> novamente</span>';
        mostrarBotaoFechar();
    }
    // ── Sem verifier (aba recarregada ou sessao expirou) ─────────────
    else if (code && !verifier) {
        msgEl.innerHTML   = '&#128260; LINK JA UTILIZADO';
        msgEl.style.color = '#ffbd2e';
        detailEl.innerHTML =
            'A sessao expirou ou esta aba foi recarregada.<br>' +
            'O codigo de segurança nao foi encontrado.<br><br>' +
            '<span style="color:#aaa">&#9658; FECHE esta aba<br>' +
            '&#9658; No bot, clique em <b style="color:#00ff41">conectar</b><br>' +
            '&#9658; Clique em <b style="color:#00ff41">CONECTAR CONTA DERIV</b> novamente</span>';
        mostrarBotaoFechar();
    }
    // ── Sem code (pagina aberta diretamente) ─────────────────────────
    else if (!code) {
        msgEl.innerHTML   = '&#9888; PAGINA DIRETA';
        msgEl.style.color = '#ffbd2e';
        detailEl.innerHTML =
            'Esta pagina so funciona apos o login na Deriv.<br><br>' +
            '<span style="color:#aaa">&#9658; No bot, clique em <b style="color:#00ff41">conectar</b><br>' +
            '&#9658; Clique em <b style="color:#00ff41">CONECTAR CONTA DERIV</b></span>';
        mostrarBotaoFechar();
    }
    // ── Fluxo normal ─────────────────────────────────────────────────
    else {
        fetch('https://garrabot.duckdns.org/auth/deriv', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code: code, verifier: verifier })
        })
        .then(function(res) { return res.json(); })
        .then(function(data) {
            if (data.ok) {
                msgEl.innerHTML   = '&#9989; ACESSO AUTORIZADO';
                msgEl.style.color = '#00ff41';
                msgEl.style.textShadow = '0 0 20px #00ff41';
                detailEl.innerHTML = 'TOKEN RECEBIDO COM SUCESSO<br>FECHANDO EM <span id="cnt" style="font-size:2.5rem;color:#ffbd2e;text-shadow:0 0 16px #ffbd2e;vertical-align:middle;line-height:1;">5</span> SEGUNDOS...';
                var c = 5;
                var t = setInterval(function() {
                    c--;
                    var el = document.getElementById('cnt');
                    if (el) el.textContent = c;
                    if (c <= 0) { clearInterval(t); window.close(); }
                }, 1000);
            } else {
                msgEl.innerHTML   = '&#10060; FALHA NA AUTENTICACAO';
                msgEl.style.color = '#ff4444';
                detailEl.innerHTML = (data.erro || 'Erro desconhecido') +
                    '<br><br><span style="color:#aaa">&#9658; Feche esta aba e tente novamente.</span>';
                mostrarBotaoFechar();
            }
        })
        .catch(function(err) {
            msgEl.innerHTML   = '&#10060; ERRO DE CONEXAO';
            msgEl.style.color = '#ff4444';
            detailEl.innerHTML = String(err) +
                '<br><br><span style="color:#aaa">&#9658; Verifique se o bot esta rodando e tente novamente.</span>';
            mostrarBotaoFechar();
        });
    }
</script>
</body>
</html>
