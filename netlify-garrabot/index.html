<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GARRABOT — Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;font-family:'Courier New',monospace;overflow:hidden}
canvas{position:fixed;top:0;left:0;z-index:0}
.center{position:fixed;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;z-index:10}
.box{border:1px solid #00ff41;padding:44px 38px;width:430px;text-align:center;
     box-shadow:0 0 50px rgba(0,255,65,0.4),inset 0 0 40px rgba(0,255,65,0.04);
     background:rgba(0,5,0,0.90);position:relative}
.box::before{content:'';position:absolute;top:-1px;left:10%;width:80%;height:2px;
             background:linear-gradient(90deg,transparent,#00ff41,transparent)}
.logo{font-size:1.5rem;letter-spacing:8px;color:#00ff41;margin-bottom:4px;text-shadow:0 0 20px #00ff41}
.sub{font-size:0.6rem;letter-spacing:4px;color:#1a5c2a;margin-bottom:28px}
.divider{border:none;border-top:1px solid rgba(0,255,65,0.2);margin:18px 0}
.features{list-style:none;text-align:left;margin:0 auto 24px;display:inline-block}
.features li{font-size:0.68rem;color:#4a9a5a;letter-spacing:1px;margin-bottom:6px;padding-left:4px}
.features li::before{content:'→ ';color:#00ff41}
.btn{width:100%;padding:13px;background:rgba(0,255,65,0.08);border:1px solid #00ff41;
     color:#00ff41;font-family:'Courier New',monospace;font-size:0.82rem;
     letter-spacing:2px;cursor:pointer;transition:background .2s;margin-top:4px}
.btn:hover:not(:disabled){background:rgba(0,255,65,0.22)}
.btn:disabled{opacity:.55;cursor:default}
.status{font-size:0.62rem;color:#555;letter-spacing:1px;margin-top:12px;min-height:16px}
.status.ok{color:#00ff41}
.status.err{color:#ff4444}
</style>
</head>
<body>
<canvas id="mx"></canvas>
<div class="center">
  <div class="box">
    <div class="logo">GARRABOT</div>
    <div class="sub">CYBER TRADING SYSTEM v2.0</div>
    <hr class="divider">
    <ul class="features">
      <li>AUTENTICACAO SEGURA VIA DERIV OAUTH2</li>
      <li>SEUS DADOS NAO SAO ARMAZENADOS</li>
      <li>CONEXAO CRIPTOGRAFADA PKCE</li>
    </ul>
    <button class="btn" id="btn-conectar" onclick="conectar()">
      ⚡ &nbsp;CONECTAR CONTA DERIV
    </button>
    <div class="status" id="status-msg">AGUARDANDO CONEXAO...</div>
  </div>
</div>

<script>
/* ── Matrix rain ────────────────────────────────────────────── */
(function(){
  var cv=document.getElementById('mx'),ctx=cv.getContext('2d');
  var ch='GARRABOT01ABCDEFｦｧｨｩｪｫｬｭｮｯｰｱｲｳｴｵｶｷｸｹｺ0123456789$#@%&'.split('');
  var cols,drops;
  function rsz(){cv.width=window.innerWidth;cv.height=window.innerHeight;cols=Math.floor(cv.width/16);drops=Array(cols).fill(1);}
  rsz();window.addEventListener('resize',rsz);
  setInterval(function(){
    ctx.fillStyle='rgba(0,0,0,0.05)';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.font='14px Courier New';
    for(var i=0;i<drops.length;i++){
      var c=ch[Math.floor(Math.random()*ch.length)];
      ctx.fillStyle=drops[i]*16<cv.height*0.1?'#fff':'#00ff41';
      ctx.fillText(c,i*16,drops[i]*16);
      if(drops[i]*16>cv.height&&Math.random()>0.975)drops[i]=0;
      drops[i]++;
    }
  },50);
})();

/* ── Lê parâmetro ?tipo= da URL ─────────────────────────────── */
function getTipo(){
  var p=new URLSearchParams(window.location.search);
  return (p.get('tipo')||'DEMO').toUpperCase();
}

/* ── Botão conectar ─────────────────────────────────────────── */
function setStatus(msg,cls){
  var el=document.getElementById('status-msg');
  el.textContent=msg;
  el.className='status'+(cls?' '+cls:'');
}

function conectar(){
  var btn=document.getElementById('btn-conectar');
  btn.disabled=true;
  setStatus('ENVIANDO CREDENCIAIS...');

  var tipo=getTipo();
  fetch('/open-login-pkce?tipo='+tipo)
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(d){
      if(!d.url){setStatus('ERRO: servidor nao retornou URL','err');btn.disabled=false;return;}
      setStatus('REDIRECIONANDO PARA DERIV...','ok');
      setTimeout(function(){window.location.href=d.url;},400);
    })
    .catch(function(e){
      setStatus('ERRO: '+(e.message||e),'err');
      btn.disabled=false;
    });
}
</script>
</body>
</html>
